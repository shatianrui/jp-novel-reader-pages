<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
<title>{% block title %}日文小説 · 阅读站{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%23c23b22'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff8ef' font-family='serif' font-weight='700'%3E%E8%AA%AD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&amp;display=swap&amp;text=%E6%97%A5%E6%96%87%E5%B0%8F%E8%AA%AC%E8%AA%AD%E3%81%BF%E3%81%9F%E3%81%84%E7%89%A9%E8%AA%9E%E3%82%92%E3%80%81%E9%9D%99%E3%81%8B%E3%81%AB%E3%82%80%E3%80%82%E3%81%AA%E3%82%8D%E3%81%86%E7%95%B0%E4%B8%96%E7%95%8C%E8%BB%A2%E7%94%9F%E6%82%AA%E5%BD%B9%E4%BB%A4%E5%AC%A2%E3%82%B9%E3%83%AD%E3%83%BC%E3%83%A9%E3%82%A4%E3%83%95%E3%81%96%E3%81%BE%E3%81%81%E8%BF%BD%E6%94%BE%E7%BB%A7%E7%BB%AD%E9%98%85%E8%AF%BB%E5%8F%91%E7%8E%B0%E4%BD%9C%E5%93%81%E7%AE%80%E4%BB%8B%E7%AB%A0%E8%8A%82%E7%9B%AE%E5%BD%95%E5%88%97%E8%A1%A8%E8%BF%9B%E5%BA%A6%E4%BF%A1%E6%81%AF%E8%AE%BE%E7%BD%AE%E5%87%BA%E4%BA%86%E4%B8%80%E7%82%B9%E9%97%AE%E9%A2%98%E5%85%B1%E8%AF%9D%E6%88%91%E7%9A%84%E4%B9%A6%E6%9E%B6%E5%A4%9A%E6%BA%90%E6%9C%AC%E5%9C%B0%C2%B7%E3%83%BBAa%E3%81%820123456789%20" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body class="light {% block body_class %}{% endblock %}">
<script>
try { if (localStorage.getItem("siteTheme") === "dark") { document.body.classList.add("dark"); document.body.classList.remove("light"); } } catch (e) {}
</script>
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="logo" aria-label="日文小説 首页">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-red">日文</span><span class="logo-gray">小説</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">首页</a>
      <a href="/?order=hyoka" class="nav-link" data-nav-order="hyoka">排行榜</a>
      <a href="/?order=favnovelcnt" class="nav-link" data-nav-order="favnovelcnt">热门收藏</a>
      <a href="/?order=new" class="nav-link" data-nav-order="new">最新更新</a>
    </div>
    <div class="nav-tools">
      <form class="nav-search" action="/" method="get" role="search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" name="q" id="navSearchInput" placeholder="搜索作品、作者…" autocomplete="off" aria-label="搜索">
        <kbd>/</kbd>
      </form>
      <button class="theme-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<footer class="footer">
  <div class="footer-inner">
    <span class="footer-brand"><span class="logo-mark" aria-hidden="true"></span>日文小説</span>
    <p>内容来源：<a href="https://syosetu.com" target="_blank" rel="noopener">小説家になろう</a>（合法公开平台）· 本站仅供日语学习与交流，版权归原作者所有</p>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
