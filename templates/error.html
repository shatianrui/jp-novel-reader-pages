{% extends "base.html" %}
{% block title %}出错了 · 日文小説{% endblock %}
{% block content %}
<div class="container" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:96px 0 72px;">
  <div class="cover cover--l cover--other" aria-hidden="true" style="transform:rotate(-3deg);margin-bottom:32px;">
    <span class="cover-title">頁が見つかりません</span>
    <span class="cover-seal">読</span>
  </div>
  <p class="hero-brand">日文小説</p>
  <h1 class="section-heading" style="margin-bottom:12px;">出现了一点问题</h1>
  <p style="color:var(--text-muted);margin:0 0 28px;max-width:32em;">{{ message }}</p>
  <a href="/" class="btn-primary">返回首页</a>
</div>
{% endblock %}
