{% extends "base.html" %}
{% block title %}阅读中 · 日文小説{% endblock %}
{% block body_class %}is-reader{% endblock %}

{% block content %}
<!-- Reader bar -->
<header class="reader-toolbar">
  <div class="toolbar-left">
    <a href="/novel/{{ ncode }}" class="toolbar-btn toolbar-back" title="返回目录">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>目录</span>
    </a>
  </div>
  <div class="toolbar-center">
    <a href="/novel/{{ ncode }}" class="toolbar-novel-title" id="toolbarNovelTitle">加载中…</a>
    <span class="toolbar-sep">/</span>
    <span class="toolbar-ch-title" id="toolbarChTitle"></span>
  </div>
  <div class="toolbar-right">
    <button class="toolbar-btn icon-btn nav-step" id="prevBtn" type="button" onclick="goChapter('prev')" disabled title="上一话（←）" aria-label="上一话">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="toolbar-btn icon-btn nav-step" id="nextBtn" type="button" onclick="goChapter('next')" disabled title="下一话（→）" aria-label="下一话">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button class="toolbar-btn icon-btn" type="button" data-settings-toggle onclick="toggleSettings()" title="阅读设置（S）" aria-label="阅读设置">
      <span class="aa">Aa</span>
    </button>
  </div>

  <!-- Progress Bar -->
  <div class="read-progress-bar" id="progressBar"></div>
</header>

<!-- Settings Panel -->
<div class="settings-panel" id="settingsPanel" style="display:none" role="dialog" aria-label="阅读设置">
  <div class="settings-inner">
    <div class="settings-head">
      <span class="settings-title">阅读设置</span>
      <button type="button" class="settings-close" onclick="toggleSettings()" aria-label="关闭">×</button>
    </div>
    <div class="setting-row setting-row--stack">
      <span class="setting-label">字号 <b id="fontSizeVal">21</b></span>
      <div class="font-size-ctrl">
        <button type="button" class="fs-step" onclick="stepFontSize(-1)" aria-label="减小字号">A</button>
        <input type="range" id="fontSizeRange" min="16" max="30" step="1" value="21" aria-label="字号" oninput="setFontSize(Number(this.value))">
        <button type="button" class="fs-step fs-step--lg" onclick="stepFontSize(1)" aria-label="增大字号">A</button>
      </div>
    </div>
    <div class="setting-row setting-row--stack">
      <span class="setting-label">主题</span>
      <div class="theme-swatches">
        <button type="button" class="bg-btn" data-bg="sepia" onclick="setReaderBg('sepia')"><span class="swatch swatch--sepia">あ</span>米黄</button>
        <button type="button" class="bg-btn" data-bg="light" onclick="setReaderBg('light')"><span class="swatch swatch--light">あ</span>白纸</button>
        <button type="button" class="bg-btn" data-bg="dark" onclick="setReaderBg('dark')"><span class="swatch swatch--dark">あ</span>夜间</button>
      </div>
    </div>
    <div class="setting-row">
      <span>字体</span>
      <div class="btn-group">
        <button type="button" onclick="setFont('serif')">明朝</button>
        <button type="button" onclick="setFont('sans')">ゴシック</button>
      </div>
    </div>
    <div class="setting-row">
      <span>行距</span>
      <div class="btn-group">
        <button type="button" onclick="setLineHeight(1.6)">紧凑</button>
        <button type="button" onclick="setLineHeight(2)">适中</button>
        <button type="button" onclick="setLineHeight(2.6)">宽松</button>
      </div>
    </div>
    <div class="setting-row">
      <span>版心</span>
      <div class="btn-group">
        <button type="button" data-width="narrow" onclick="setWidth('narrow')">窄</button>
        <button type="button" data-width="normal" onclick="setWidth('normal')">标准</button>
        <button type="button" data-width="wide" onclick="setWidth('wide')">宽</button>
      </div>
    </div>
  </div>
</div>

<!-- Reader Area -->
<div class="reader-wrap" id="readerWrap">
  <div class="reader-loading" id="readerLoading">
    <div class="spinner"></div>
    <p>正在加载章节内容…</p>
  </div>
  <article class="reader-article" id="readerArticle" style="display:none">
    <p class="reader-kicker" id="readerKicker"></p>
    <h1 class="reader-ch-title" id="readerChTitle"></h1>
    <div class="reader-ornament" aria-hidden="true"><span></span></div>
    <div class="reader-foreword" id="readerForeword"></div>
    <div class="reader-content" id="readerContent"></div>
    <div class="reader-afterword" id="readerAfterword"></div>
  </article>
  <div class="reader-error" id="readerError" style="display:none">
    <p>内容加载失败，请稍后重试</p>
    <p class="reader-error-detail" id="readerErrorDetail" style="font-size:0.85em;opacity:0.75"></p>
    <button type="button" onclick="loadContent()">重新加载</button>
    <a id="readerOriginLink" href="https://ncode.syosetu.com/{{ ncode }}/{{ chapter }}/" target="_blank" rel="noopener" class="btn-outline">原站打开此话</a>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="reader-nav-bottom" aria-label="章节导航">
  <button class="nav-big-btn" id="prevBtnBottom" type="button" onclick="goChapter('prev')" disabled>
    <span>← 上一话</span><span class="nav-sub" id="prevSub"></span>
  </button>
  <a href="/novel/{{ ncode }}" class="nav-big-btn nav-center">目录</a>
  <button class="nav-big-btn nav-dock-only" type="button" data-settings-toggle onclick="toggleSettings()">设置</button>
  <button class="nav-big-btn" id="nextBtnBottom" type="button" onclick="goChapter('next')" disabled>
    <span>下一话 →</span><span class="nav-sub" id="nextSub"></span>
  </button>
</nav>
{% endblock %}

{% block extra_scripts %}
<script>
const NCODE = '{{ ncode }}';
let currentChapter = parseInt('{{ chapter }}', 10);
let prevChapter = null;
let nextChapter = null;
const DEFAULT_FONT_SIZE = 21;
const MIN_FONT_SIZE = 16;
const MAX_FONT_SIZE = 30;
const READER_WIDTHS = { narrow: 600, normal: 680, wide: 820 };
const READING_PROGRESS_KEY = 'readingProgress';
let chapterChangedByNavigation = false;
let progressSaveTimer = null;
let currentNovelTitle = '';
let currentChapterTitle = '';

// Reading preferences
let prefs = {};
try { prefs = JSON.parse(localStorage.getItem('readerPrefs') || '{}') || {}; } catch (e) { prefs = {}; }

async function loadContent() {
  const article = document.getElementById('readerArticle');
  const loading = document.getElementById('readerLoading');
  const errDiv = document.getElementById('readerError');

  article.style.display = 'none';
  loading.style.display = 'flex';
  errDiv.style.display = 'none';

  try {
    const res = await fetch(`/api/content/${NCODE}/${currentChapter}`);
    const data = await res.json();

    if (data.error && !data.content) {
      throw new Error(data.error);
    }

    currentNovelTitle = data.novel_title || '';
    currentChapterTitle = data.title || '';

    // Toolbar
    document.getElementById('toolbarNovelTitle').textContent = data.novel_title || NCODE;
    document.getElementById('toolbarChTitle').textContent = data.title || '';
    document.getElementById('readerChTitle').textContent = data.title || '';
    document.getElementById('readerKicker').textContent =
      `${data.novel_title ? data.novel_title + ' · ' : ''}第 ${currentChapter} 话`;
    document.title = `${data.title} · ${data.novel_title} · 日文小説`;

    // Content
    document.getElementById('readerContent').innerHTML = data.content || '<p>内容为空</p>';
    const fw = document.getElementById('readerForeword');
    const aw = document.getElementById('readerAfterword');
    if (data.foreword) {
      fw.innerHTML = `<div class="word-wrap"><h4>前書き</h4>${data.foreword}</div>`;
    } else {
      fw.innerHTML = '';
    }
    if (data.afterword) {
      aw.innerHTML = `<div class="word-wrap"><h4>後書き</h4>${data.afterword}</div>`;
    } else {
      aw.innerHTML = '';
    }

    // Navigation
    prevChapter = data.prev_chapter;
    nextChapter = data.next_chapter;
    updateNavBtns();
    syncSettingButtons();

    loading.style.display = 'none';
    article.style.display = 'block';
    const restored = restoreReadingPosition();
    if (chapterChangedByNavigation || !restored) {
      saveReadingProgressNow();
    } else {
      scheduleSaveProgress();
    }
    chapterChangedByNavigation = false;
  } catch(e) {
    loading.style.display = 'none';
    errDiv.style.display = 'flex';
    document.getElementById('readerErrorDetail').textContent = e && e.message ? e.message : '';
    document.getElementById('readerOriginLink').href = `https://ncode.syosetu.com/${NCODE}/${currentChapter}/`;
    console.error(e);
  }
}

function updateNavBtns() {
  ['prevBtn','prevBtnBottom'].forEach(id => {
    const btn = document.getElementById(id);
    btn.disabled = prevChapter === null;
  });
  ['nextBtn','nextBtnBottom'].forEach(id => {
    const btn = document.getElementById(id);
    btn.disabled = nextChapter === null;
  });
  document.getElementById('prevSub').textContent = prevChapter === null ? '已是第一话' : `第 ${prevChapter} 话`;
  document.getElementById('nextSub').textContent = nextChapter === null ? '已是最新一话' : `第 ${nextChapter} 话`;
}

function goChapter(dir) {
  const target = dir === 'prev' ? prevChapter : nextChapter;
  if (target !== null) {
    saveReadingProgressNow();
    currentChapter = target;
    chapterChangedByNavigation = true;
    history.pushState({}, '', `/read/${NCODE}/${currentChapter}`);
    loadContent();
  }
}

// Settings
function toggleSettings(force) {
  const p = document.getElementById('settingsPanel');
  const open = typeof force === 'boolean' ? force : p.style.display === 'none';
  p.style.display = open ? 'block' : 'none';
  document.querySelectorAll('[data-settings-toggle]').forEach(b => b.classList.toggle('active', open));
}

document.addEventListener('click', e => {
  const p = document.getElementById('settingsPanel');
  if (p.style.display === 'none') return;
  if (p.contains(e.target) || e.target.closest('[data-settings-toggle]')) return;
  toggleSettings(false);
});

function setFontSize(size) {
  size = Math.min(MAX_FONT_SIZE, Math.max(MIN_FONT_SIZE, Number(size) || DEFAULT_FONT_SIZE));
  document.getElementById('readerArticle').style.fontSize = size + 'px';
  prefs.fontSize = size;
  savePrefs();
  syncSettingButtons();
}
function stepFontSize(delta) {
  setFontSize((prefs.fontSize || DEFAULT_FONT_SIZE) + delta);
}
function setFont(type) {
  const art = document.getElementById('readerArticle');
  art.style.fontFamily = type === 'sans' ? 'var(--font-jp-sans)' : 'var(--font-jp-serif)';
  prefs.font = type === 'sans' ? 'sans' : 'serif';
  savePrefs();
  syncSettingButtons();
}
function setLineHeight(lh) {
  document.getElementById('readerArticle').style.lineHeight = lh;
  prefs.lineHeight = lh;
  savePrefs();
  syncSettingButtons();
}
function setWidth(key) {
  const width = READER_WIDTHS[key] || READER_WIDTHS.normal;
  document.body.style.setProperty('--reader-width', width + 'px');
  prefs.width = READER_WIDTHS[key] ? key : 'normal';
  savePrefs();
  syncSettingButtons();
}
function setReaderBg(bg) {
  document.body.dataset.readerBg = bg;
  prefs.readerBg = bg;
  savePrefs();
  syncSettingButtons();
  const color = getComputedStyle(document.body).getPropertyValue('--reader-bg').trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(meta => meta.setAttribute('content', color));
}
function savePrefs() {
  try { localStorage.setItem('readerPrefs', JSON.stringify(prefs)); } catch (e) {}
}
function applyPrefs() {
  setFontSize(prefs.fontSize || DEFAULT_FONT_SIZE);
  setFont(prefs.font || 'serif');
  setLineHeight(prefs.lineHeight || 2);
  setWidth(prefs.width || 'normal');
  setReaderBg(prefs.readerBg || 'sepia');
}

function syncSettingButtons() {
  const size = prefs.fontSize || DEFAULT_FONT_SIZE;
  document.querySelectorAll('.settings-inner button').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll(`[onclick="setFont('${prefs.font || 'serif'}')"]`).forEach(btn => btn.classList.add('active'));
  document.querySelectorAll(`[onclick="setLineHeight(${Number(prefs.lineHeight || 2)})"]`).forEach(btn => btn.classList.add('active'));
  document.querySelectorAll(`.settings-inner [data-width="${prefs.width || 'normal'}"]`).forEach(btn => btn.classList.add('active'));
  document.querySelectorAll(`.bg-btn[data-bg="${prefs.readerBg || 'sepia'}"]`).forEach(btn => btn.classList.add('active'));
  const range = document.getElementById('fontSizeRange');
  range.value = size;
  range.style.setProperty('--fill', ((size - MIN_FONT_SIZE) / (MAX_FONT_SIZE - MIN_FONT_SIZE) * 100) + '%');
  document.getElementById('fontSizeVal').textContent = size;
}

// Reading progress bar
window.addEventListener('scroll', () => {
  const doc = document.documentElement;
  const denominator = doc.scrollHeight - doc.clientHeight;
  const pct = denominator > 0 ? doc.scrollTop / denominator * 100 : 0;
  document.getElementById('progressBar').style.width = Math.min(100, pct) + '%';
  scheduleSaveProgress();
}, { passive: true });

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowLeft') goChapter('prev');
  if (e.key === 'ArrowRight') goChapter('next');
  if (e.key === 's') toggleSettings();
  if (e.key === 'Escape') toggleSettings(false);
});

window.addEventListener('popstate', () => {
  const chapter = Number.parseInt(window.location.pathname.split('/').pop(), 10);
  if (Number.isInteger(chapter)) {
    currentChapter = chapter;
    chapterChangedByNavigation = false;
    loadContent();
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    saveReadingProgressNow();
  }
});

window.addEventListener('beforeunload', saveReadingProgressNow);

function getScrollRatio() {
  const doc = document.documentElement;
  const denominator = doc.scrollHeight - doc.clientHeight;
  if (denominator <= 0) return 0;
  return Math.min(1, Math.max(0, doc.scrollTop / denominator));
}

function saveReadingProgressNow() {
  const map = loadReadingProgressMap();
  const key = String(NCODE).toLowerCase();
  const entry = {
    ...map[key],
    chapter: Number.isInteger(currentChapter) && currentChapter > 0 ? currentChapter : 1,
    scrollRatio: getScrollRatio(),
    updatedAt: new Date().toISOString(),
  };
  if (currentNovelTitle) entry.title = currentNovelTitle;
  if (currentChapterTitle) entry.chapterTitle = currentChapterTitle;
  map[key] = entry;
  try { localStorage.setItem(READING_PROGRESS_KEY, JSON.stringify(map)); } catch (e) {}
}

function loadReadingProgressMap() {
  try {
    const parsed = JSON.parse(localStorage.getItem(READING_PROGRESS_KEY) || '{}');
    return parsed && typeof parsed === 'object' ? parsed : {};
  } catch (e) {
    return {};
  }
}

function getReadingProgress() {
  const map = loadReadingProgressMap();
  const progress = map[String(NCODE).toLowerCase()];
  return progress && typeof progress === 'object' ? progress : null;
}

function restoreReadingPosition() {
  const progress = getReadingProgress();
  const savedChapter = Number.parseInt(progress?.chapter, 10);
  const savedRatio = Number(progress?.scrollRatio);
  if (chapterChangedByNavigation || savedChapter !== currentChapter || !Number.isFinite(savedRatio) || savedRatio <= 0) {
    window.scrollTo(0, 0);
    return false;
  }
  window.requestAnimationFrame(() => {
    const doc = document.documentElement;
    const denominator = doc.scrollHeight - doc.clientHeight;
    const targetTop = denominator > 0 ? Math.round(Math.min(1, Math.max(0, savedRatio)) * denominator) : 0;
    window.scrollTo(0, targetTop);
  });
  return true;
}

function scheduleSaveProgress() {
  if (progressSaveTimer !== null) return;
  progressSaveTimer = window.setTimeout(() => {
    progressSaveTimer = null;
    saveReadingProgressNow();
  }, 300);
}

applyPrefs();
loadContent();
</script>
{% endblock %}
