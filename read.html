<body class="light">
  <script>
    try { if (localStorage.getItem("siteTheme") === "dark") { document.body.classList.add("dark"); document.body.classList.remove("light"); } } catch (e) {}

        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </div>

  <main>
    <div class="reader-toolbar">
      <div class="toolbar-left">
        <a href="index.html" class="toolbar-btn" id="catalogLink" title="返回目录">← 目录</a>
      </div>
      <div class="toolbar-center">
        <span class="toolbar-novel-title" id="toolbarNovelTitle">加载中…</span>
        <span class="toolbar-sep">›</span>
        <span class="toolbar-ch-title" id="toolbarChTitle"></span>
      </div>
      <div class="toolbar-right">
        <button class="toolbar-btn" id="settingsBtn" type="button" title="阅读设置">设置</button>
        <button class="toolbar-btn" id="prevBtn" type="button" disabled>‹ 上一话</button>
        <button class="toolbar-btn" id="nextBtn" type="button" disabled>下一话 ›</button>
      </div>
    </div>

    <div class="settings-panel" id="settingsPanel" style="display:none">
      <div class="settings-inner">
        <div class="setting-row">
          <span>字体大小</span>
          <div class="btn-group">
            <button type="button" data-font-size="18">小</button>
            <button type="button" data-font-size="21" class="active">中</button>
            <button type="button" data-font-size="24">大</button>
            <button type="button" data-font-size="28">特大</button>
          </div>
        </div>
        <div class="setting-row">
          <span>背景颜色</span>
          <div class="btn-group">
            <button type="button" class="bg-btn" data-bg="light">白色</button>
            <button type="button" class="bg-btn" data-bg="sepia">米黄</button>
            <button type="button" class="bg-btn" data-bg="dark">夜间</button>
          </div>
        </div>
        <div class="setting-row">
          <span>字体</span>
          <div class="btn-group">
            <button type="button" data-font="sans">黑体</button>
            <button type="button" data-font="serif" class="active">宋体</button>
          </div>
        </div>
        <div class="setting-row">
          <span>行间距</span>
          <div class="btn-group">
            <button type="button" data-line-height="1.6">紧凑</button>
            <button type="button" data-line-height="2" class="active">适中</button>
            <button type="button" data-line-height="2.6">宽松</button>
          </div>
        </div>
      </div>
    </div>

    <div class="read-progress-bar" id="progressBar"></div>

    <div class="reader-wrap" id="readerWrap">
      <div class="reader-loading" id="readerLoading">
        <div class="spinner"></div>
        <p>正在加载章节内容…</p>
      </div>
      <article class="reader-article" id="readerArticle" style="display:none">
        <h1 class="reader-ch-title" id="readerChTitle"></h1>
        <div class="reader-foreword" id="readerForeword"></div>
        <div class="reader-content" id="readerContent"></div>
        <div class="reader-afterword" id="readerAfterword"></div>
      </article>
      <div class="reader-error" id="readerError" style="display:none">
        <p>内容加载失败，请稍后重试</p>
        <button class="btn-primary" id="reloadBtn" type="button">重新加载</button>
      </div>
    </div>

    <div class="reader-nav-bottom">
      <button class="nav-big-btn" id="prevBtnBottom" type="button" disabled>← 上一话</button>
      <a href="index.html" class="nav-big-btn nav-center" id="catalogLinkBottom">目录</a>
      <button class="nav-big-btn" id="nextBtnBottom" type="button" disabled>下一话 →</button>
